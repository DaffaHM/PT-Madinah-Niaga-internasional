name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build & export Next.js static files ───────────────────────────
      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production

      # ── 5. Upload folder `out/` ke public_html via FTP ───────────────────
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          # Hanya upload file yang berubah (diff-based deploy)
          dangerous-clean-slate: false
          # Exclude file penting yang tidak boleh dihapus di server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess
            .htpasswd
            cgi-bin/**
            error_log
            php.ini
          log-level: verbose
          security: strict
